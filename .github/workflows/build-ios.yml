name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'netflix-clone-expo/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install

      - name: ⚙️ Generate Native iOS Project with Expo Prebuild
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS Project with Xcode (Unsigned / Sideload Ready)
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          WORKSPACE_FILE=$(ls -d *.xcworkspace | head -n 1)
          echo "Discovered Workspace: $WORKSPACE_FILE"
          
          # Auto-detect the primary Scheme from xcodebuild list
          SCHEME_NAME=$(xcodebuild -list -workspace "$WORKSPACE_FILE" | awk '/Schemes:/{flag=1; next} /^[A-Z]/ && flag{exit} flag && NF{print $1; exit}')
          echo "Detected Primary Scheme: $SCHEME_NAME"
          
          xcodebuild -workspace "$WORKSPACE_FILE" \
                     -scheme "$SCHEME_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE="" \
                     clean build

      - name: 📦 Package into .IPA File
        run: |
          mkdir -p Payload
          APP_PATH=$(find netflix-clone-expo/ios/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found compiled iOS App: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully created FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: FIMAX-Cinema.ipa
          retention-days: 30

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}