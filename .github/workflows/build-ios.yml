name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'netflix-clone-expo/package-lock.json'

      - name: 📦 Install Project Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install

      - name: ⚙️ Generate Native iOS Project with Expo Prebuild
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean --no-install

      - name: 🍫 Run CocoaPods Install
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          pod install || pod install --repo-update || true

      - name: 📦 Pre-bundle main.jsbundle into iOS folder
        working-directory: ./netflix-clone-expo
        run: |
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle --assets-dest ios

      - name: 🔨 Compile Native iOS Release App with Xcode
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
          CI: 1
        run: |
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $(which node))"
          
          xcodebuild -workspace FIMAXCinema.xcworkspace \
                     -scheme "FIMAXCinema" \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     SKIP_BUNDLING=1 \
                     build

      - name: 📦 Package into .IPA File
        run: |
          mkdir -p Payload
          APP_PATH=$(find netflix-clone-expo/ios/build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find netflix-clone-expo/ios -name "*.app" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully created FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: FIMAX-Cinema.ipa
          retention-days: 30

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}