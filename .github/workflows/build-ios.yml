name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'netflix-clone-expo/package-lock.json'

      - name: 📦 Install Project Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install

      - name: ⚙️ Generate Native iOS Project with Expo Prebuild
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean --no-install

      - name: 🍫 Run CocoaPods Install
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          pod install || pod install --repo-update || true

      - name: 🔨 Compile iOS Release Build with Xcode
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $(which node))"
          
          WORKSPACE="FIMAXCinema.xcworkspace"
          echo "Compiling Workspace: $WORKSPACE"
          
          # 1. Attempt Native Device Archive for TrollStore / Sideloadly
          echo "===> Step A: Building iOS Device Target..."
          xcodebuild archive \
                     -workspace "$WORKSPACE" \
                     -scheme "FIMAXCinema" \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -archivePath build/FIMAXCinema.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO > build_device.log 2>&1 || true
          
          # Check if xcarchive was created
          if [ -d "build/FIMAXCinema.xcarchive/Products/Applications" ]; then
            echo "Device Archive succeeded!"
            mkdir -p build/out
            cp -r build/FIMAXCinema.xcarchive/Products/Applications/*.app build/out/
          else
            echo "Device Archive failed, proceeding to Step B: Simulator Build..."
            echo "Last 40 lines of Device Build Log:"
            tail -n 40 build_device.log
            
            xcodebuild build \
                       -workspace "$WORKSPACE" \
                       -scheme "FIMAXCinema" \
                       -configuration Release \
                       -destination "platform=iOS Simulator,name=iPhone 15" \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       ENABLE_USER_SCRIPT_SANDBOXING=NO \
                       COMPILER_INDEX_STORE_ENABLE=NO > build_sim.log 2>&1 || true
            
            mkdir -p build/out
            SIM_APP=$(find build/Build/Products -name "*.app" | head -n 1)
            if [ -n "$SIM_APP" ]; then
              echo "Simulator App built at: $SIM_APP"
              cp -r "$SIM_APP" build/out/
            else
              echo "Simulator build log:"
              tail -n 60 build_sim.log
            fi
          fi

      - name: 📦 Package into .IPA File
        working-directory: ./netflix-clone-expo/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/out -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL: No .app found in build directory!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ../../FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully generated FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA and Logs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: |
            FIMAX-Cinema.ipa
            netflix-clone-expo/ios/build_device.log
            netflix-clone-expo/ios/build_sim.log
          retention-days: 30

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}