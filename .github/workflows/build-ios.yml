name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'netflix-clone-expo/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install

      - name: ⚙️ Generate Native iOS Project with Expo Prebuild
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean

      - name: 📦 Bundle JavaScript Assets
        working-directory: ./netflix-clone-expo
        run: |
          npx expo export --platform ios --output-dir ./dist

      - name: 🔨 Build iOS App with Xcode
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          WORKSPACE_NAME=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1 | sed 's|^\./||')
          echo "Building in Workspace: $WORKSPACE_NAME"
          
          # List Xcode schemes
          xcodebuild -list -workspace "$WORKSPACE_NAME"
          
          # Execute build and log full output
          xcodebuild -workspace "$WORKSPACE_NAME" \
                     -scheme "FIMAXCinema" \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build > xcodebuild_device.log 2>&1 || {
            echo "Device build failed! Error summary:"
            grep -E "(error:|fatal error:|BUILD FAILED|FAILED)" xcodebuild_device.log | head -n 40
            echo "--- Full last 100 lines ---"
            tail -n 100 xcodebuild_device.log
            
            echo "Trying simulator target build..."
            xcodebuild -workspace "$WORKSPACE_NAME" \
                       -scheme "FIMAXCinema" \
                       -configuration Release \
                       -sdk iphonesimulator \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean build > xcodebuild_sim.log 2>&1 || {
              echo "Simulator build error summary:"
              grep -E "(error:|fatal error:|BUILD FAILED|FAILED)" xcodebuild_sim.log | head -n 40
              tail -n 100 xcodebuild_sim.log
              exit 1
            }
          }

      - name: 📦 Package into .IPA File
        working-directory: ./netflix-clone-expo/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ../../FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully generated FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: FIMAX-Cinema.ipa
          retention-days: 30

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}