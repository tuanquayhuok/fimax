name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'netflix-clone-expo/package-lock.json'

      - name: 📱 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      - name: 📦 Install Project Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install

      - name: ⚙️ Generate Native iOS Project
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Release Build with Xcode
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
        run: |
          # Ensure CocoaPods dependencies are updated
          pod install
          
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          echo "Compiling Workspace: $WORKSPACE"
          
          # Build target for Simulator and Sideload (Zero Signing Requirement)
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "FIMAXCinema" \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: 📦 Package into .IPA File
        working-directory: ./netflix-clone-expo/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ../../FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully generated FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: FIMAX-Cinema.ipa
          retention-days: 30

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}