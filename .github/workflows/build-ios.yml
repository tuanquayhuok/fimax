name: Build FIMAX Cinema iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-ipa:
    runs-on: macos-15
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🍎 Select Xcode 16+
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: 🟢 Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./netflix-clone-expo/package.json

      - name: 📦 Install Project Dependencies
        working-directory: ./netflix-clone-expo
        run: |
          npm install --legacy-peer-deps --prefer-offline

      - name: ⚡ Restore CocoaPods & DerivedData Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            netflix-clone-expo/ios/Pods
            netflix-clone-expo/ios/build
          key: ${{ runner.os }}-ios-cache-${{ hashFiles('netflix-clone-expo/package.json', 'netflix-clone-expo/app.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-cache-

      - name: ⚙️ Generate Native iOS Project with Expo Prebuild
        working-directory: ./netflix-clone-expo
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean
          
          # Setup .xcode.env.local for Xcode Node binary detection
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "export PATH=\"$(dirname $NODE_PATH):$PATH\"" >> ios/.xcode.env.local
          echo "Configured .xcode.env.local with: $NODE_PATH"

      - name: 🔨 Fast Multi-threaded Xcode Compilation
        working-directory: ./netflix-clone-expo/ios
        env:
          LANG: en_US.UTF-8
          CI: 1
        run: |
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $(which node))"
          
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -not -path "*/project.xcworkspace*" | head -n 1)
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE_PATH" ]; then
            echo "Found Workspace: $WORKSPACE_PATH"
            BUILD_FLAG="-workspace $WORKSPACE_PATH"
            SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          elif [ -n "$PROJECT_PATH" ]; then
            echo "Found Project: $PROJECT_PATH"
            BUILD_FLAG="-project $PROJECT_PATH"
            SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found!"
            exit 1
          fi
          
          NCPU=$(sysctl -n hw.ncpu || echo 4)
          echo "🔨 Supercharged Build ($NCPU Cores): $SCHEME_NAME..."
          
          xcodebuild $BUILD_FLAG \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -jobs "$NCPU" \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     DEBUG_INFORMATION_FORMAT=dwarf \
                     ONLY_ACTIVE_ARCH=YES \
                     build

      - name: 📦 Package into .IPA File
        run: |
          mkdir -p Payload
          APP_PATH=$(find netflix-clone-expo/ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find netflix-clone-expo/ios -name "*.app" -type d | head -n 1)
          fi
          
          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr FIMAX-Cinema.ipa Payload
          rm -rf Payload
          echo "Successfully created FIMAX-Cinema.ipa!"

      - name: 🚀 Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIMAX-Cinema-iOS-IPA
          path: FIMAX-Cinema.ipa
          retention-days: 14

      - name: 🌟 Auto Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.4-build-${{ github.run_number }}
          name: "FIMAX Cinema iOS IPA v2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 FIMAX Cinema iOS Native App
            - Đầy đủ tính năng Xem phim 4K, Tự động xoay màn hình, Thu nhỏ PiP.
            - Đồng bộ Live Web từ fimax.aecongnghe.online.
            - Cài đặt trực tiếp qua TrollStore, Scarlet, Esign, Sideloadly hoặc AltStore.
          files: FIMAX-Cinema.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
